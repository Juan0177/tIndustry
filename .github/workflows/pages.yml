name: Pages

# Website on GitHub Pages (tools/sito/costruisci.py → _site/). Manual (Actions → Pages → Run workflow)
# or on release tags, like the other workflows: never on push or pull requests.
# Run it from main (`gh workflow run pages.yml --ref main`): the github-pages environment only deploys from
# the default branch and from v* tags (environment rule). One-time setup: Settings → Pages → Source "GitHub Actions".
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Costruisci il sito
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the download button shows the latest tag (git describe)

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          python -m pip install --quiet Pillow==12.3.0
          python -m unittest discover -s tools/sito -p "test_*.py"
          python tools/sito/costruisci.py --out _site

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblica
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
