name: Pages

# Website on GitHub Pages (tools/sito/costruisci.py → _site/). Manual (Actions → Pages → Run workflow)
# or on release tags, like the other workflows: never on push or pull requests.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Costruisci il sito
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: |
          python -m pip install --quiet Pillow==12.3.0
          python -m unittest tools/sito/test_costruisci.py
          python tools/sito/costruisci.py --out _site

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblica
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
