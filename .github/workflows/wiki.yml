name: Wiki

# Publishes docs/wiki/ to the GitHub Wiki of the repository (Juan0177/tIndustry.wiki). Manual only
# (Actions → Wiki → Run workflow, or `gh workflow run wiki.yml --ref main`): never on push or pull requests.
# The Wiki mirrors docs/wiki/: pages edited on the web are overwritten and pages missing from docs/wiki/
# are removed. One-time setup: Settings → Features → Wikis on, then create any first page on the web
# (GitHub creates the Wiki's git repository only after the first page exists).
on:
  workflow_dispatch:

permissions:
  contents: write  # GITHUB_TOKEN pushes to the Wiki's repository

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    name: Pubblica il Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check pages
        run: python3 tools/dev/controlla_wiki.py

      - name: Publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp docs/wiki/*.md wiki/
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki già aggiornato"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Wiki da docs/wiki/ (${GITHUB_SHA::7})"
          git push -q origin HEAD
          git log --oneline -1
