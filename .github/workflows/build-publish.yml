name: Build publish

# Manual only (Actions → Build publish → Run workflow). Releases run tests in release.yml.
on:
  workflow_dispatch:

jobs:
  # Official path: Shared sim + Godot 4 .NET client (build-only; editor binary not required).
  godot-shared:
    name: Godot + Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build Shared
        run: dotnet build src/TIndustry.Shared/TIndustry.Shared.csproj -c Release

      - name: Test Shared
        run: dotnet test tests/TIndustry.Shared.Tests/TIndustry.Shared.Tests.csproj -c Release

      - name: Test AgentPlay (MCP server over stdio)
        run: dotnet test tests/TIndustry.AgentPlay.Tests/TIndustry.AgentPlay.Tests.csproj -c Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sprites come only from tools/art/genera.py (ADR 0004): generator tests, and the PNGs in godot/assets
      # must match a fresh generation pixel for pixel (--pixel: the Linux PNG encoder writes other bytes).
      - name: Test sprite generator
        run: |
          python -m pip install --quiet Pillow==12.3.0
          python -m unittest tools/art/test_genera.py
          python tools/art/genera.py --controlla --pixel
          python -m unittest tools/sito/test_costruisci.py
          python -m unittest tools/sito/test_stato.py
          python tools/art/logo_documenti.py --controlla

      - name: Ensure Godot solution
        run: |
          if [[ ! -f godot/TIndustry.Godot.sln ]]; then
            (cd godot && dotnet new sln -n TIndustry.Godot --format sln --force)
            (cd godot && dotnet sln TIndustry.Godot.sln add TIndustry.Godot.csproj)
            (cd godot && dotnet sln TIndustry.Godot.sln add ../src/TIndustry.Shared/TIndustry.Shared.csproj)
          fi

      - name: Build Godot C#
        run: dotnet build godot/TIndustry.Godot.csproj -c Release
