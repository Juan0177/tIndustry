name: Build publish

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:
    branches:
      - main
      - "cursor/**"

jobs:
  # Official path: Shared sim + Godot 4 .NET client (build-only; editor binary not required).
  godot-shared:
    name: Godot + Shared
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build Shared
        run: dotnet build src/TIndustry.Shared/TIndustry.Shared.csproj -c Release

      - name: Ensure Godot solution
        run: |
          if [[ ! -f godot/TIndustry.Godot.sln ]]; then
            (cd godot && dotnet new sln -n TIndustry.Godot --format sln --force)
            (cd godot && dotnet sln TIndustry.Godot.sln add TIndustry.Godot.csproj)
            (cd godot && dotnet sln TIndustry.Godot.sln add ../src/TIndustry.Shared/TIndustry.Shared.csproj)
          fi

      - name: Build Godot C#
        run: dotnet build godot/TIndustry.Godot.csproj -c Release

  # Legacy Raylib client — regression + optional download artifact.
  publish-win-x64:
    name: Publish win-x64 (Raylib legacy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TIndustry.Logistics.csproj

      - name: Build
        run: dotnet build TIndustry.Logistics.csproj -c Release --no-restore

      - name: Self-test
        run: dotnet run --project TIndustry.Logistics.csproj -c Release --no-build -- --self-test

      - name: Publish win-x64 (self-contained)
        run: >
          dotnet publish TIndustry.Logistics.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/raylib-win-x64

      - name: Upload win-x64 artifact (Raylib legacy)
        uses: actions/upload-artifact@v4
        with:
          name: tIndustry-raylib-legacy-win-x64
          path: artifacts/raylib-win-x64/
          if-no-files-found: error

  publish-linux-x64:
    name: Publish linux-x64 (Raylib legacy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish linux-x64 (self-contained)
        run: >
          dotnet publish TIndustry.Logistics.csproj
          -c Release
          -r linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/raylib-linux-x64

      - name: Upload linux-x64 artifact (Raylib legacy)
        uses: actions/upload-artifact@v4
        with:
          name: tIndustry-raylib-legacy-linux-x64
          path: artifacts/raylib-linux-x64/
          if-no-files-found: error
