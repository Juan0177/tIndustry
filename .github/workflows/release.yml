name: Release

# Assets: Godot 4 .NET Windows/Linux exports.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da rilanciare (es. v0.3.1); vuoto = solo build senza create-release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export-godot:
    name: Export Godot (official)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test Shared
        run: dotnet test tests/TIndustry.Shared.Tests/TIndustry.Shared.Tests.csproj -c Release

      - name: Test AgentPlay (MCP server over stdio)
        run: dotnet test tests/TIndustry.AgentPlay.Tests/TIndustry.AgentPlay.Tests.csproj -c Release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test sprite generator
        run: |
          python -m pip install --quiet Pillow==12.3.0
          python -m unittest tools/art/test_genera.py
          python tools/art/genera.py --controlla --pixel

      - name: Install Godot + export templates
        run: |
          chmod +x tools/ci/setup-godot.sh tools/ci/export-godot.sh
          ./tools/ci/setup-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Export Godot Windows + Linux
        env:
          GODOT_BIN: godot4
        run: ./tools/ci/export-godot.sh

      - name: Upload Godot zips
        uses: actions/upload-artifact@v4
        with:
          name: tIndustry-godot-zips
          path: |
            dist/tIndustry-win-x64.zip
            dist/tIndustry-linux-x64.zip
          if-no-files-found: error
          # Only a hand-off to the github-release job: the zips live on in the release, so keep the artifact one day
          # (the default 90 days of two ~65 MB zips fills the account's Actions storage).
          retention-days: 1

  github-release:
    name: Create GitHub Release
    needs: [export-godot]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot zips
        uses: actions/download-artifact@v4
        with:
          name: tIndustry-godot-zips
          path: dist

      - name: List dist
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tIndustry-win-x64.zip
            dist/tIndustry-linux-x64.zip
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
