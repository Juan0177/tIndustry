name: Release

# Primary assets: Godot 4 .NET Windows/Linux exports.
# Optional legacy: Raylib self-contained zips (clearly suffixed).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag esistente da rilanciare (es. v0.3.1); vuoto = solo build senza create-release"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  export-godot:
    name: Export Godot (official)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install Godot + export templates
        run: |
          chmod +x tools/ci/setup-godot.sh tools/ci/export-godot.sh
          ./tools/ci/setup-godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Export Godot Windows + Linux
        env:
          GODOT_BIN: godot4
        run: ./tools/ci/export-godot.sh

      - name: Upload Godot zips
        uses: actions/upload-artifact@v4
        with:
          name: tIndustry-godot-zips
          path: |
            dist/tIndustry-win-x64.zip
            dist/tIndustry-linux-x64.zip
            dist/tIndustry-godot-win-x64.zip
            dist/tIndustry-godot-linux-x64.zip
          if-no-files-found: error

  publish-raylib-legacy:
    name: Publish Raylib legacy zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore / build / self-test
        run: |
          dotnet restore TIndustry.Logistics.csproj
          dotnet build TIndustry.Logistics.csproj -c Release --no-restore
          dotnet run --project TIndustry.Logistics.csproj -c Release --no-build -- --self-test

      - name: Publish win-x64 + linux-x64
        run: |
          mkdir -p artifacts/raylib-win artifacts/raylib-linux dist
          dotnet publish TIndustry.Logistics.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o artifacts/raylib-win
          dotnet publish TIndustry.Logistics.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o artifacts/raylib-linux
          (cd artifacts/raylib-win && zip -qr ../../dist/tIndustry-raylib-legacy-win-x64.zip .)
          (cd artifacts/raylib-linux && zip -qr ../../dist/tIndustry-raylib-legacy-linux-x64.zip .)
          ls -lh dist/

      - name: Upload Raylib legacy zips
        uses: actions/upload-artifact@v4
        with:
          name: tIndustry-raylib-legacy-zips
          path: dist/tIndustry-raylib-legacy-*.zip
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [export-godot, publish-raylib-legacy]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot zips
        uses: actions/download-artifact@v4
        with:
          name: tIndustry-godot-zips
          path: dist

      - name: Download Raylib legacy zips
        uses: actions/download-artifact@v4
        with:
          name: tIndustry-raylib-legacy-zips
          path: dist

      - name: List dist
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tIndustry-win-x64.zip
            dist/tIndustry-linux-x64.zip
            dist/tIndustry-godot-win-x64.zip
            dist/tIndustry-godot-linux-x64.zip
            dist/tIndustry-raylib-legacy-win-x64.zip
            dist/tIndustry-raylib-legacy-linux-x64.zip
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
